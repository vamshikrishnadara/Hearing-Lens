[server]
# Model libraries expose lazy modules that source watching can import unnecessarily.
fileWatcherType = "none"
maxUploadSize = 10
# Keep request protections enabled on public deployments.
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
# Both entrypoints use the same explicit view switch in app/streamlit_app.py.
showSidebarNavigation = false

[theme]
# White button labels on the default coral miss the normal-text contrast target.
base = "light"
primaryColor = "#15607a"
backgroundColor = "#f6f8fa"
secondaryBackgroundColor = "#edf3f4"
textColor = "#182b3a"
