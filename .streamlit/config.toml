[server]
# Model libraries expose lazy modules that source watching can import unnecessarily.
fileWatcherType = "none"
maxUploadSize = 10
# Keep request protections enabled on public deployments.
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
# Both entrypoints use the same explicit view switch in app/streamlit_app.py.
showSidebarNavigation = false

[theme]
# Deep navy surfaces, readable teal links, and white text on primary buttons.
base = "dark"
primaryColor = "#26796d"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131f30"
textColor = "#e6edf5"
linkColor = "#72dfc5"
borderColor = "#34465a"
chartCategoricalColors = ["#72dfc5", "#83b7ff", "#d3a4f5", "#ffc58a", "#f390a6", "#b9d879", "#82d5ec"]
